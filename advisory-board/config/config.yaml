squad:
  name: advisory-board
  display_name: "Equipo del Consejo Asesor" 
  version: "1.0.0"
  domain: "Asesoría Estratégica" 
  description: "Una junta virtual de los pensadores estratégicos, inversores y personas más influyentes del mundo.\nfilósofos del liderazgo. Cada asesor aporta décadas de experiencia en real-world .\nen marcos viables. Desde la toma de decisiones principles-based de Ray Dalio hasta\nLiderazgo courage-based de Brene Brown.\n\nEste tablero cubre estrategia de inversión, modelos mentales, inteligencia de red, escalamiento,purpose-driven liderazgo, dinámica de equipo, emprendimiento minimalista y mission-drivennegocio. Cuatro dominios de asesoramiento: financiero, empresarial, organizacional y filosófico."
  keywords: [strategy, investment, leadership, mental-models, scaling, purpose, teams, entrepreneurship, culture, decision-frameworks]
  entry_agent: board-chair
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orchestration"
    agents: [board-chair]
    purpose: "Triaje, enrutamiento, control de calidad, facilitación de sesiones de asesoramiento" 
  tier_1:
    name: "Asesores Estratégicos" 
    agents: [ray-dalio, charlie-munger, naval-ravikant, peter-thiel, reid-hoffman, simon-sinek, brene-brown, patrick-lencioni, derek-sivers, yvon-chouinard]
    purpose: "Experiencia en el dominio en inversión, riesgo, liderazgo, cultura y filosofía del fundador." 

agents:
  board-chair:       { file: agents/board-chair.md, tier: 0, icon: "🏛️", focus: "Triaje, enrutamiento, facilitación de asesoramiento"  }
  ray-dalio:         { file: agents/ray-dalio.md, tier: 1, icon: "📈", focus: "Decisiones basadas en principios, gestión de riesgos"  }
  charlie-munger:    { file: agents/charlie-munger.md, tier: 1, icon: "🧠", focus: "Modelos mentales, asignación de capital"  }
  naval-ravikant:    { file: agents/naval-ravikant.md, tier: 1, icon: "⚡", focus: "Creación de riqueza, apalancamiento, primeros principios"  }
  peter-thiel:       { file: agents/peter-thiel.md, tier: 1, icon: "🚀", focus: "Pensamiento contrario, monopolio, cero a uno"  }
  reid-hoffman:      { file: agents/reid-hoffman.md, tier: 1, icon: "🌐", focus: "Efectos de red, blitzscaling"  }
  simon-sinek:       { file: agents/simon-sinek.md, tier: 1, icon: "🎯", focus: "Liderazgo con propósito, juego infinito"  }
  brene-brown:       { file: agents/brene-brown.md, tier: 1, icon: "💛", focus: "Vulnerabilidad, coraje, confianza"  }
  patrick-lencioni:  { file: agents/patrick-lencioni.md, tier: 1, icon: "👥", focus: "Salud del equipo, disfunción organizacional"  }
  derek-sivers:      { file: agents/derek-sivers.md, tier: 1, icon: "🎵", focus: "Emprendimiento minimalista, simplicidad contraria"  }
  yvon-chouinard:    { file: agents/yvon-chouinard.md, tier: 1, icon: "🏔️", focus: "Negocios impulsados por una misión, activismo ambiental"  }

handoffs:
  board-chair: { routes_to: [ray-dalio, charlie-munger, naval-ravikant, peter-thiel, reid-hoffman, simon-sinek, brene-brown, patrick-lencioni, derek-sivers, yvon-chouinard] }
  ray-dalio: { escalates_to: [board-chair] }
  charlie-munger: { escalates_to: [board-chair] }
  naval-ravikant: { escalates_to: [board-chair] }
  peter-thiel: { escalates_to: [board-chair] }
  reid-hoffman: { escalates_to: [board-chair] }
  simon-sinek: { escalates_to: [board-chair] }
  brene-brown: { escalates_to: [board-chair] }
  patrick-lencioni: { escalates_to: [board-chair] }
  derek-sivers: { escalates_to: [board-chair] }
  yvon-chouinard: { escalates_to: [board-chair] }

