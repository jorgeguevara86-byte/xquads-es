squad:
  name: brand-squad
  display_name: "Equipo de Marca" 
  version: "1.0.0"
  domain: "Estrategia de marca, identidad, posicionamiento, arquitectura, naming, arquetipos y crecimiento." 
  description: "El equipo de estrategia de marca definitivo: 10 pensadores de marca legendarios clonados como agentes de IA\nmás 4 especialistas funcionales y 1 orquestador. Del valor de marca de Aaker al de Sharpevidence-based marketing, desde Identity Prism de Kapferer hasta StoryBrand de Miller: esto\nEl equipo cubre todas las dimensiones de la construcción de marca, posicionamiento, identidad, arquitectura,\ny crecimiento."
  keywords: ["valor de marca" , positioning, "identidad de marca" , messaging, "arquitectura de marca" , naming, archetypes, "identidad visual" , StoryBrand, "marca de lujo" , "marca de inicio" , differentiation, distinctiveness]
  entry_agent: brand-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orquestador de marca" 
    agents: [brand-chief]
    purpose: "Dirija los desafíos de la marca al especialista adecuado según el dominio del problema de la marca." 
  tier_1_strategy:
    name: "Estrategia de marca y valor" 
    agents: [david-aaker, kevin-keller, jean-noel-kapferer]
    purpose: "Modelos de valor de marca, sistemas de identidad, gestión estratégica de marca." 
  tier_1_positioning:
    name: "Posicionamiento y Diferenciación" 
    agents: [al-ries, byron-sharp, marty-neumeier]
    purpose: "Posicionamiento en el mercado, estrategia de categorías, diferenciación, evidence-based crecimiento" 
  tier_1_building:
    name: "Construcción y comunicación de marca" 
    agents: [donald-miller, denise-yohn, emily-heyward]
    purpose: "Mensajería StoryBrand, brand-culture fusión, marca de inicio" 
  tier_1_identity:
    name: "Identidad y expresión de marca" 
    agents: [alina-wheeler, archetype-consultant, naming-strategist]
    purpose: "Sistemas de identidad visual, arquetipos de marca, estrategia de naming" 
  tier_2_support:
    name: "Soporte especializado" 
    agents: [domain-scout, miller-sticky-brand]
    purpose: "Disponibilidad de dominio, implementación de StoryBrand" 

