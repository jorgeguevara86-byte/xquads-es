# Books & Resources Database: Copy Master Squad
# 35+ essential copywriting, persuasion, and direct response books
# Reference for all agents — maps books to domains and frameworks

books:

  - title: "Publicidad de gran alcance" 
    author: "Eugene Schwartz" 
    year: 1966
    core_teaching: "Los niveles de sofisticación y conciencia del mercado determinan su enfoque de copia, no sus características del producto. Los 5 niveles de conciencia (sin darse cuenta, problem-aware, solution-aware, product-aware, most-aware) dicta el tipo de plomo, la dirección de la promesa, y toda la estructura de copia" 
    key_frameworks:
      - "5 Niveles de Conciencia" 
      - "5 niveles de Sofisticación del Mercado" 
      - "38 Formas de fortalecer los titulares" 
      - "Intensificación vs. Identificación" 
      - "Desire de masas" 
    essential_for: [eugene-schwartz, copy-chief, todd-brown, stefan-georgi]

  - title: "Cartas de Borón" 
    author: "Gary Halbert" 
    year: 2013
    core_teaching: "Cartas escritas de prisión a su hijo Bond, enseñando los fundamentos de la respuesta directa — investigación, selección de listas, ofertas convincentes, y el arte de escribir copia conversacional que vende" 
    key_frameworks:
      - "Correo de la pila vs. B-pile" 
      - "Star-Story-Solution" 
      - "El índice Halbert" 
      - "Prioridad de lista-offer-Copy" 
      - "Agarra...by-the- Tercera apertura" 
    essential_for: [gary-halbert, john-carlton, copy-chief]

  - title: "Scientific Advertising" 
    author: "Claude Hopkins" 
    year: 1923
    core_teaching: "La publicidad es venta en impresión — cada anuncio debe ser medido, probado y optimizado basado en la respuesta. Cupones, muestras y seguimiento son esenciales. Las opiniones son inútiles; sólo los resultados importan" 
    key_frameworks:
      - "Razón-Por qué publicidad" 
      - "Prueba todo Principio" 
      - "Estrategia de Reclamación Preventiva" 
      - "Seguimiento de respuesta de cupones" 
      - "Servicio de publicidad" 
    essential_for: [claude-hopkins, john-caples, rosser-reeves, joanna-wiebe]

  - title: "Métodos de publicidad comprobados" 
    author: "John Caples" 
    year: 1932
    core_teaching: "Metodología de pruebas en línea de referencia: cómo escribir, probar y medir los titulares científicamente. El primer libro que trae pruebas rigurosas para copiar con documentos before/after resultados" 
    key_frameworks:
      - "29 Fórmulas de titulares" 
      - "Pruebas de doble impacto" 
      - "Primeras 50 palabras Reglas" 
      - "Plantillas de encabezado probadas" 
      - "Direct vs. Indirect Headlines" 
    essential_for: [john-caples, claude-hopkins, copy-chief]

  - title: "Realidad en Publicidad" 
    author: "Rosser Reeves" 
    year: 1961
    core_teaching: "La Proposición de Vendedor Único (USP) — cada anuncio debe hacer una propuesta específica al consumidor, uno que la competencia no puede o no ofrece. La repetición de una sola idea penetra la conciencia pública" 
    key_frameworks:
      - "USP (Proposición Única de Venta)" 
      - "Penetration vs. Usage Pull" 
      - "Cretividad del vampiro (creatividad que chupa la atención del mensaje)" 
      - "Regla de la Proposición Única" 
    essential_for: [rosser-reeves, david-ogilvy, copy-chief]

  - title: "Influencia: La Psicología de la Persuasión" 
    author: "Robert Cialdini" 
    year: 1984
    core_teaching: "Seis (más tarde siete) principios universales de persuasión que rigen el cumplimiento humano — reciprocidad, commitment/consistency, prueba social, autoridad, agrado, escasez y unidad" 
    key_frameworks:
      - "6 Principios de influencia (original)" 
      - "7 Principios (con unidad)" 
      - "Patrones de respuesta de Click-Whirr" 
      - "Armas de influencia" 
    essential_for: [robert-cialdini, blair-warren, joe-sugarman, copy-chief]

  - title: "Pre-Susion" 
    author: "Robert Cialdini" 
    year: 2016
    core_teaching: "Lo que haces antes de entregar tu mensaje importa tanto como el propio mensaje: priming, framing y la canalización de la atención determinan la receptividad" 
    key_frameworks:
      - "Pre-Susion Windows" 
      - "Momentos privilegiados" 
      - "Principio de unidad" 
      - "Atención Canalización" 
      - "Association Triggers" 
    essential_for: [robert-cialdini, eugene-schwartz, oren-klaff]

  - title: "Ofertas de $100M" 
    author: "Alex Hormozi" 
    year: 2021
    core_teaching: "Cómo diseñar 'Grand Slam Offers' tan bueno que la gente se siente estúpida diciendo no - usando la Ecuación de Valor para maximizar el resultado de sueño y la probabilidad al minimizar el retraso del tiempo y el esfuerzo" 
    key_frameworks:
      - "Ecuación del valor" 
      - "Oferta Grand Slam" 
      - "Trim &amp; Stack Method" 
      - "Scarcity/Urgency/Bonuses/Guarantee Framework"
      - "Sueño de la cosecha de resultados" 
