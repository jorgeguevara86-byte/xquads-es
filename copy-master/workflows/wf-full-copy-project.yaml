workflow:
  id: wf-full-copy-project
  name: "Copiar el proyecto completo maestro" 
  version: "2.0.0"
  description: "Completo copywriting diseño flujo de trabajo de fin a fin con 32 agentes\nexpertos y capa de psicología de persuasión. Lleva a cabo un breve creativo\npor la asignación de expertos, escritura, control de psicología (Cialdini/Warren),\nCopiar revisión del Jefe Maestro y entrega final."
  trigger: "*full-copy-project"
  entry_agent: copy-master-chief
  estimated_duration: "30-60 minutes"
  type: sequential
  sequence:
    - agent: copy-master-chief
      action: diagnose
      creates: diagnosis
    - agent: copy-master-chief
      action: assign-specialist
      creates: assignment_brief
    - agent: "{assigned_specialist}"
      action: write-copy
      creates: draft_copy
    - agent: copy-master-chief
      action: psychology-checkpoint
      creates: psychology_audit
    - agent: copy-master-chief
      action: critique
      creates: critique_report
    - agent: copy-master-chief
      action: review
      creates: final_copy

phases:
  - id: phase_0
    name: "Breve y Diagnóstico" 
    agent: copy-master-chief
    task: diagnose.md
    description: "Copia Jefe Maestro recibe el informe del proyecto, diagnostica la solicitud, identifica el tipo de copia, nivel de conciencia y selecciona al mejor especialista de 32 agentes en 27 dominios." 
    outputs:
      - diagnosis: "markdown"
      - assigned_specialist: "agent-id"
      - copy_type: "string"
    checkpoint:
      gate: "Especialista identificado con alta confianza" 
      veto: "Ambiguous brief — request clarification before proceeding" 

  - id: phase_1
    name: "Asignación de personal especial" 
    agent: copy-master-chief
    task: diagnose.md
    depends_on: [phase_0]
    description: "Copia Jefe Maestro asigna formalmente el proyecto al especialista seleccionado con el breve, datos de audiencia, nivel de conciencia y cualquier material de referencia." 
    outputs:
      - assignment_brief: "markdown"
    checkpoint:
      gate: "Especialista reconocido con entregables claras" 
      veto: "Desigualdad de especialista para el tipo de copia" 

  - id: phase_2
    name: "Producción de copia" 
    agent: "{assigned_specialist}"
    task: "{matched_task}"
    depends_on: [phase_1]
    description: "El especialista asignado escribe la copia utilizando su metodología de firma. La tarea es seleccionada dinámicamente según el tipo de copia: write-headline.md, write-sales-letter.md, write-vsl-script.md, write-email-sequence.md, write-ad-copy.md, write-landing-page.md, create-funnel-copy.md, write-bullets.md, create-offer.md, write-webinar-script.md, o write-pitch-deck.md. Cada tarea incluye la fase de capa psicológica con los principios de Cialdini y Warren." 
    outputs:
      - draft_copy: "markdown"
    checkpoint:
      gate: "Proyecto completo con todas las secciones requeridas por formato de tarea, incluyendo la Capa Psicológica" 
      veto: "Proyecto de secciones críticas desaparecidas, off-brief, o falta de persuasión de la psicología mapeo" 

  - id: phase_3
    name: "Punto de control de Psicología" 
    agent: copy-master-chief
    task: review.md
    depends_on: [phase_2]
    description: "Copia Jefe Maestro verifica que la capa de psicología de persuasión se aplica correctamente. Cheques que al mínimo 3 Los principios Cialdini son activos, 2 palancas Warren están comprometidos, y los principios se tejen naturalmente (no se atornillan). Para ofertas, valida la Ecuación de Valor Hormozi." 
    outputs:
      - psychology_audit: "markdown"
      - psychology_pass: "boolean"
    checkpoint:
      gate: "Mínimo 3 Principios Cialdini activos Y 2 Warren palancas comprometidas" 
      veto: "Menos de 3 principios Cialdini O principios aplicados engañosamente" 

  - id: phase_4
    name: "Chief Critique" 
    agent: copy-master-chief
    task: critique-copy.md
    depends_on: [phase_3]
    description: "Copia Jefe de Maestra revisa el proyecto utilizando el marco de crítica mejorado de 8 puntos más auditoría de psicología de persuasión. Partituras, identifica cuestiones y determina si la copia está lista para la entrega o necesita revisión." 
    outputs:
      - critique_report: "markdown"
      - verdict: "string"
    checkpoint:
      gate: "Puntuación compuesta √≥ 60% (Veredicto de la tirantez o elite) Y control de psicología aprobado" 
      veto: "Marcaje compuesto  ⁇  40% - especialista debe reescribir" 

  - id: phase_5
    name: "Entrega final" 
    agent: copy-master-chief
    task: review.md
    depends_on: [phase_4]
    description: "Copia Jefe Maestro compila el paquete final entregable con la copia aprobada, notas críticas, documentación de arquitectura de persuasión y recomendaciones de uso." 
    outputs:
      - final_copy: "markdown"
      - usage_notes: "markdown"
      - persuasion_architecture: "markdown"
    checkpoint:
      gate: "Paquete listo para el cliente con todos los entregables incluyendo la asignación de persuasión" 
      veto: "Cuestiones críticas sin resolver todavía abiertas" 

completion_criteria:
  - "Breve diagnosticado y especialista asignado a la lista de 32 agentes" 
  - "Copia producida por el especialista adecuado utilizando la metodología correcta" 
  - "Traspaso de control de Psicología (Cialdini + Warren + Hormozi cuando corresponda)" 
  - "La crítica principal se aprobó con el veredicto Strong o Elite" 
  - "Paquete final entregado con notas de uso y arquitectura de persuasión" 
