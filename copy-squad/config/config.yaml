squad:
  name: copy-squad
  display_name: "Copiado Squad" 
  version: "1.0.0"
  domain: "Copiado de élite — respuesta directa, correo electrónico, embudos, VSLs, cartas de venta, ofertas y copia de marca" 
  description: "Escuadrón de 23 agentes de redacción — 22 legendarios redactores + 1 orquestador.\nCada agente es un high-fidelity clon de un real-world master copywriting\nrespuesta directa, correo electrónico, embudos, VSLs, cartas de ventas, ofertas y copia de marca."
  keywords: [copywriting, "respuesta directa" , "carta de ventas" , email, VSL, funnel, headline, offer, "ad copy" , launch, bullets, "copia de marca" ]
  entry_agent: copy-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orchestration"
    agents: [copy-chief]
    purpose: "Solicitudes de copiado de Triage, ruta al especialista adecuado, control de calidad" 
  tier_1a:
    name: "Respuesta directa Leyendas" 
    agents: [gary-halbert, eugene-schwartz, claude-hopkins, gary-bencivenga, robert-collier, john-carlton, jim-rutz]
    purpose: "Maestros clásicos de respuesta directa — long-form, imprimir, correo" 
  tier_1b:
    name: "Copia moderna &amp; embudos" 
    agents: [dan-kennedy, frank-kern, russell-brunson, todd-brown, stefan-georgi, jon-benson, ry-schwartz]
    purpose: "Copia de la era digital — VSLs, embudos, webinars, lanzamientos" 
  tier_1c:
    name: "Correo electrónico &quot; Relación &quot;" 
    agents: [ben-settle, andre-chaperon, dan-koe]
    purpose: "Secuencias de correo electrónico, correos electrónicos diarios, copia de la nutrición" 
  tier_1d:
    name: "Ofertas &amp; Páginas de Venta" 
    agents: [joe-sugarman, david-ogilvy, clayton-makepeace, parris-lampropoulos, david-deutsch]
    purpose: "Oferta arquitectura, anuncios impresos, financial/health Copia" 

