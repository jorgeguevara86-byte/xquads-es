# Brand Frameworks Reference
# Referenced by specialist agents for structured methodology application

frameworks:
  aaker_brand_equity:
    source: "David Aaker: Gestión del valor de la marca (1991), Creación de marcas sólidas (1996)" 
    description: "Modelo de cinco pilares para medir y construir valor de marca" 
    components:
      - name: "Conocimiento de marca" 
        description: "La fuerza de la presencia de la marca en la mente del consumidor. Va desde el reconocimiento (¿he oído hablar de ello?) hasta el top-of-mind (primera marca que se me ocurre en la categoría)." 
      - name: "Calidad percibida" 
        description: "La percepción del cliente de la calidad general o superioridad del producto en relación con las alternativas. No calidad real, calidad percibida." 
      - name: "Asociaciones de marca" 
        description: "Cualquier cosa vinculada mentalmente a la marca: atributos, beneficios, actitudes, imágenes, símbolos. Cuanto más rica y positiva, más fuerte será el patrimonio." 
      - name: "Lealtad a la marca" 
        description: "El apego que tienen los clientes hacia la marca. Pasa de cambiadores a compradores satisfechos y defensores comprometidos. Los clientes leales son el activo más valioso de la marca." 
      - name: "Activos de marca patentada" 
        description: "Marcas comerciales, patentes, relaciones de distribución y otros activos que brindan ventajas competitivas y protegen el capital." 
    when_to_use: "Auditorías de marca, medición de patrimonio, planificación estratégica, gestión de cartera" 

  kapferer_identity_prism:
    source: "Jean-Noel Kapferer — La nueva gestión estratégica de marca (1992)" 
    description: "Modelo de seis facetas para definir la identidad de marca como un sistema coherente" 
    components:
      - name: "Physique"
        description: "Las características físicas y la identidad visual de la marca: logotipo, colores, empaque, diseño del producto. Cómo se ve la marca." 
      - name: "Personality"
        description: "El carácter y los rasgos humanos de la marca. Si la marca fuera una persona, ¿cómo describirías su personalidad?" 
      - name: "Culture"
        description: "Los valores, principios y origen de la marca. La ideología y el sistema de creencias detrás de la marca." 
      - name: "Relationship"
        description: "El tipo de relación que la marca establece con sus clientes. ¿Transaccional? ¿Tutoría? ¿Amistad? ¿Asociación?" 
      - name: "Reflection"
        description: "El espejo exterior: cómo el cliente objetivo se ve a sí mismo a través de la marca. El self-image aspiracional que permite la marca." 
      - name: "Autoimagen" 
        description: "El espejo interior: cómo se sienten internamente los clientes cuando utilizan la marca. El diálogo interno que la marca apoya." 
    when_to_use: "Diseño de identidad de marca, auditorías de consistencia, actualización de identidad, alineación interna de marca" 

  ries_positioning:
    source: "Al Ries y Jack Trout — Posicionamiento: La batalla por tu mente (1981)" 
    description: "La teoría fundamental del posicionamiento de marca: poseer un espacio distinto en la mente del cliente potencial" 
    components:
      - name: "Escalera de categorías" 
        description: "Los consumidores organizan las marcas en escaleras mentales por categoría. El objetivo es estar en el peldaño más alto de una escalera, incluso si tienes que crear uno nuevo." 
      - name: "Ventaja del primero en actuar" 
        description: "Es mejor ser primero en una categoría que ser mejor. Si no puedes ser el primero, crea una categoría donde seas el primero." 
      - name: "Poseer una palabra" 
        description: "El posicionamiento más poderoso es poseer una sola palabra en la mente del cliente potencial. Volvo = seguridad. FedEx = durante la noche." 
      - name: "Ley de lo opuesto" 
        description: "Si no eres el líder, posiciónate contra el líder. Sea todo lo contrario. Si son grandes, que sean pequeños. Si son viejos, que sean nuevos." 
      - name: "Enfoque estrecho" 
        description: "Sacrifica amplitud por profundidad. Una marca que intenta ser todo para todos no significa nada para nadie." 
    when_to_use: "Estrategia de posicionamiento, análisis competitivo, creación de categorías, desarrollo de tagline" 

  sharp_distinctiveness:
    source: "Byron Sharp - Cómo crecen las marcas (2010)" 
    description: "Branding basado en evidencia centrado en la disponibilidad física y mental" 
    components:
      - name: "Disponibilidad mental" 
        description: "La probabilidad de que un comprador piense en la marca en una situación de compra. Construido a través de una comunicación consistente y broad-reaching ." 
      - name: "Disponibilidad física" 
        description: "Que fácil es encontrar y comprar la marca. Distribución, espacio en estantería, presencia digital, accesibilidad." 
      - name: "Activos distintivos de la marca" 
        description: "Elementos visuales y verbales que están asociados de forma única con la marca: colores, formas, sonidos, personajes, eslóganes. Distinción sobre diferenciación." 
      - name: "Alcance sobre frecuencia" 
        description: "Llegar a más personas una vez es más efectivo que llegar a menos personas muchas veces. Priorice el amplio alcance." 
      - name: "Categoría Puntos de entrada" 
        description: "Las situaciones de compra y las señales que desencadenan la necesidad de la categoría. Las marcas deben vincularse a tantos puntos de entrada como sea posible." 
    when_to_use: "Estrategia de crecimiento, planificación de medios, desarrollo de activos de marca, penetración de mercado." 

  twelve_archetypes:
    source: "Carl Jung, aplicado al branding por Margaret Mark & Carol Pearson (The Hero and the Outlaw, 2001)" 
    description: "Doce patrones de carácter universales que las marcas pueden incorporar para crear una conexión emocional" 
    components:
      - name: "Innocent"
        description: "Deseo: Paraíso. Objetivo: la felicidad. Miedo: Hacer mal. Ejemplo: Paloma, Coca-Cola" 
      - name: "Explorer"
        description: "Deseo: Libertad. Objetivo: descubrimiento. Miedo: Conformidad. Ejemplo: Jeep, Patagonia" 
      - name: "Sage"
        description: "Deseo: Verdad. Objetivo: comprensión. Miedo: Ignorancia. Ejemplo: Google, BBC" 
      - name: "Hero"
        description: "Deseo: Maestría. Meta: Logro. Miedo: Debilidad. Ejemplo: Nike, FedEx" 
      - name: "Outlaw"
        description: "Deseo: Liberación. Objetivo: Revolución. Miedo: Impotencia. Ejemplo: Harley-Davidson, Virgen" 
      - name: "Magician"
        description: "Deseo: Transformación. Objetivo: hacer realidad los sueños. Miedo: consecuencias no deseadas. Ejemplo: Apple, Disney" 
      - name: "Chico normal" 
        description: "Deseo: Pertenencia. Objetivo: Conexión. Miedo: Destacar. Ejemplo: IKEA, objetivo" 
      - name: "Lover"
        description: "Deseo: Intimidad. Objetivo: Relación. Miedo: Rechazo. Ejemplo: Chanel, Godiva" 
      - name: "Jester"
        description: "Deseo: Disfrute. Objetivo: Pasarlo genial. Miedo: Aburrimiento. Ejemplo: Old Spice, M&M" 
      - name: "Caregiver"
        description: "Deseo: Servicio. Objetivo: Ayudar a los demás. Miedo: Egoísmo. Ejemplo: Johnson & Johnson, TOMS" 
      - name: "Creator"
        description: "Deseo: Innovación. Objetivo: crear algo de valor. Miedo: Mediocridad. Ejemplo: LEGO, Adobe" 
      - name: "Ruler"
        description: "Deseo: Control. Objetivo: Orden y prosperidad. Miedo: Caos. Ejemplo: Mercedes, Rolex" 
    when_to_use: "Desarrollo de personalidad de marca, estrategia de mensajería, creación de contenido, dirección de identidad visual." 

  storybrand_sb7:
    source: "Donald Miller - Construyendo una StoryBrand (2017)" 
    description: "Marco de siete elementos para aclarar los mensajes de la marca a través de la estructura de la historia." 
    components:
      - name: "Character"
        description: "El cliente es el héroe. Defina quiénes son y qué quieren." 
      - name: "Problem"
        description: "El villano y los problemas externos, internos y filosóficos que enfrenta el héroe." 
      - name: "Guide"
        description: "La marca es la guía: expresa empatía y autoridad." 
      - name: "Plan"
        description: "Un plan simple de 3 pasos que elimina la confusión y genera confianza." 
      - name: "Llamado a la acción" 
        description: "Un CTA directo (comprar, registrarse) y un CTA de transición (descargar, ver)." 
      - name: "Failure"
        description: "Lo negativo en juego: ¿qué sucede si el héroe no actúa?" 
      - name: "Success"
        description: "La transformación positiva: cómo será la vida después." 
    when_to_use: "Copia del sitio web, mensajes de marca, guiones de ventas, material de marketing, presentaciones" 

  wheeler_brand_identity_process:
    source: "Alina Wheeler - Diseño de identidad de marca (2003, 5.a ed. 2017)" 
    description: "Proceso de cinco fases para el diseño e implementación de la identidad de marca." 
    components:
      - name: "Fase 1: Realización de la investigación" 
        description: "Audite la marca existente, analice la competencia, entreviste a las partes interesadas y realice encuestas a los clientes. Entender antes de crear." 
      - name: "Fase 2: Estrategia Aclaradora" 
        description: "Definir posicionamiento, arquitectura de marca, estrategia de naming y mensajes clave. Estrategia antes que diseño." 
      - name: "Fase 3: Diseño de identidad" 
        description: "Explora conceptos visuales, diseña el logo, selecciona tipografía y colores, desarrolla el sistema visual." 
      - name: "Fase 4: Creación de puntos de contacto" 
        description: "Aplique la identidad a todos los puntos de contacto de la marca: tarjetas de presentación, sitio web, empaque, señalización, digital y ambiental." 
      - name: "Fase 5: Gestión de activos" 
        description: "Construya pautas de marca, cree plantillas, capacite al equipo, establezca gobernanza para la gestión continua de la marca." 
    when_to_use: "Proyectos completos de identidad de marca, cambios de marca, diseño de sistemas de marca, gobierno de identidad." 
