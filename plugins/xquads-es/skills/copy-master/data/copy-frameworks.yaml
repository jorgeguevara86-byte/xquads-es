# Copy Frameworks Database: Copy Master Squad
# 25 proven copywriting and persuasion frameworks
# Each with creator, source, detailed steps, use cases, and application examples

frameworks:

  - name: "AIDA"
    creator: "Elias St. Elmo Lewis" 
    source: "Principios publicitarios (1898), popularizados por innumerables editores" 
    steps:
      - step: "Attention"
        detail: "Abierto con una interrupción del patrón — reclamo atrevido, estatura impactante, pregunta provocativa, o perturbación visual que detiene el pergamino" 
      - step: "Interest"
        detail: "Puente al mundo del lector: conecta el gancho con su problema específico, deseo o situación con empatía y especificidad" 
      - step: "Desire"
        detail: "Pintar la transformación — mostrar el after-state vívidamente, apilar beneficios, utilizar la prueba social, y hacer que el resultado se sienta inevitable" 
      - step: "Action"
        detail: "CTA simple clara con urgencia o escasez — decirles exactamente qué hacer a continuación y por qué hacerlo ahora importa" 
    when_to_use: "Marco universal para cualquier short-to-medium copia donde necesita una estructura simple y probada" 
    best_for: [ads, "landing pages" , emails, "puestos sociales" , "descripciones de productos" ]
    example_application: "Facebook ad: Gancho con sorprendente estatus → conectarse al dolor de audiencia → mostrar beneficios del producto → 'Haga clic para reclamar su prueba gratuita'" 

  - name: "PAS"
    creator: "Dan Kennedy (popularized)" 
    source: "La carta de ventas definitiva (1990)" 
    steps:
      - step: "Problem"
        detail: "Agitar el problema específico que el lector enfrenta —nombre, describir cómo se siente, hacer que se fijen en reconocimiento" 
      - step: "Agitate"
        detail: "Twist el cuchillo — mostrar las consecuencias de NO resolver el problema, los costos ocultos, el daño agravante, el peaje emocional" 
      - step: "Solution"
        detail: "Presentar su oferta como la respuesta lógica e inevitable: transición del dolor al alivio con un mecanismo claro" 
    when_to_use: "Cuando el público es problem-aware pero aún no solution-awareMejor para pain-driven mercados" 
    best_for: [emails, ads, "landing pages" , "puestos sociales" , "frigoríficos" ]
    example_application: "Correo electrónico: 'Pasar 4 hours/day en la entrada de datos manual? → Eso es 1.000 hours/year nunca volverás → Nuestra automatización lo maneja en 12 minutos" 

  - name: "PASTOR"
    creator: "Ray Edwards" 
    source: "Cómo escribir copia que vende (2016)" 
    steps:
      - step: "Person/Problem"
        detail: "Identificar a la persona exacta y su problema específico: utilizar su idioma, sus frustraciones, su realidad diaria" 
      - step: "Amplify"
        detail: "Ampliar las consecuencias de la inacción — lo que ocurre en 6 meses, 1 año, 5 años si nada cambia" 
      - step: "Story/Solution"
        detail: "Cuenta la historia de origen de la solución — cómo se descubrió, por qué funciona de manera diferente, el momento de avance" 
      - step: "Transformation"
        detail: "Show before/after contraste — resultados específicos, mensurables otros han logrado. Testimonios y estudios de casos" 
      - step: "Offer"
        detail: "Presentar la oferta completa — lo que obtienen, cómo se entrega, bonificaciones, garantías, la pila de valor completo" 
      - step: "Response"
        detail: "Llamada clara a la acción con urgencia — plazo, puntos limitados, aumento de precios, vencimiento de bonos" 
    when_to_use: "Las páginas de ventas de larga duración y las VSL donde usted necesita tomar a alguien de problema para comprar" 
    best_for: ["páginas de ventas" , VSLs, "webinar pitchs" , long-form emails]
    example_application: "Página de ventas para el programa de coaching: identificar emprendedores en dificultades → mostrar costo de estancia pegada → historia de origen del entrenador → resultados del programa → detalles del programa →" 

  - name: "BAB"
    creator: "Marco de redacción tradicional" 
    source: "Tradición de respuesta directa, popularizada por múltiples editores" 
    steps:
      - step: "Before"
        detail: "Pintar la realidad dolorosa actual — cómo es la vida ahora mismo con el problema. Ser específico y visceral" 
      - step: "After"
        detail: "Pintar el estado futuro deseado — cómo es la vida después de la solución. Hacerlo tangible, emocional y deseable" 
      - step: "Bridge"
        detail: "Mostrar cómo tu product/service es el puente entre los dos estados - el mecanismo que hace posible la transformación" 
    when_to_use: "Cuando usted necesita una simple narrativa de transformación — trabaja especialmente bien para before/after cuentos" 
    best_for: [emails, "puestos sociales" , "estudios de casos" , "Marcos testimoniales" , "páginas de aterrizaje cortas" ]
    example_application: "Correo electrónico: 'El año pasado estaba trabajando 80 horas semanas apenas haciendo $5K/month → Ahora trabajo 25 horas y claro $30K → Aquí está el sistema que cambió todo'" 

  - name: "4 P" 
    creator: "Henry Hoke Sr." 
    source: "Tradición de correo directo (mid-20th siglo)" 
    steps:
      - step: "Promise"
        detail: "Liderado con el mayor beneficio específico, el resultado primario que el lector alcanzará" 
      - step: "Picture"
        detail: "Pintar una película mental vívida de la vida después de lograr la promesa — comprometer todos los sentidos, hacerlo real" 
      - step: "Proof"
        detail: "Retrocede la promesa con evidencia — testimonios, estudios de casos, estadísticas, demostraciones, credenciales, lógica" 
      - step: "Push"
        detail: "Conducir a la acción con urgencia — fecha límite, escasez, inversión de riesgos, bono para la acción rápida" 
    when_to_use: "Anuncios de respuesta directa y páginas de aterrizaje donde usted necesita un apretado, benefit-driven estructura" 
    best_for: ["correo directo" , "landing pages" , "anuncios impresos" , "anuncios de visualización" ]
    example_application: "Página de aterrizaje: 'Lose 20 lbs en 90 días → Imagínate encajar en tus vaqueros universitarios → 47.000 personas lo han hecho → Únete hoy, 60 días money-back garantía" 

  - name: "RMBC"
    creator: "Stefan Georgi" 
    source: "El método RMBC (curso de formación VSL)" 
    steps:
      - step: "Research"
        detail: "Investigación de mercado profundo — leer reseñas, foros, copia de la competencia, hablar con clientes, analizar las reseñas de mi Amazon, estudiar los patrones de lenguaje del avatar" 
      - step: "Mechanism"
        detail: "Identificar o crear el mecanismo único — lo específico que hace que su solución sea diferente y creíble." 
      - step: "Brief"
        detail: "Crear un breve estructurado antes de escribir — gran idea, tipo de plomo (Schwartz), oferta, avatar, objeciones, elementos de prueba, controladores emocionales" 
      - step: "Copy"
        detail: "Escribe la copia siguiendo el breve — plomo, cuerpo, cierre. Cada sección tiene un trabajo específico. El breve evita que vagabunde" 
    when_to_use: "VSLs and long-form letras de venta: el enfoque sistemático impide el bloqueo del escritor y garantiza una alineación estratégica" 
    best_for: [VSLs, "Cartas de venta" , "long-form landing pages" , advertorials]
    example_application: "Suplemento VSL: Investigación Amazon comentarios para el lenguaje del dolor → Crear 'Cellular Reset Enzyme' mecanismo → Breve con Problem-Solution lead → Escribe 45 minutos VSL siguiente breve" 

  - name: "Star-Story-Solution" 
    creator: "Gary Halbert" 
    source: "La carta Gary Halbert / Cartas de Boron tradición" 
    steps:
      - step: "Star"
        detail: "Presentar un carácter relatable — podría ser usted, un cliente, o un cada uno ficticio. Hacer que el público se vea" 
      - step: "Story"
        detail: "Diga la lucha del personaje: el viaje, los fracasos, la frustración, el momento decisivo. Utilice detalles vivos y diálogo" 
      - step: "Solution"
        detail: "Revela el product/service como punto de inflexión en la historia — lo que hizo posible la transformación" 
    when_to_use: "Cuando quieres vender a través de la historia en lugar de lanzar directo — ideal para escéptico o ad-fatigued audiencias" 
    best_for: [emails, advertorials, VSLs, "anuncios nativos" , "contenido social" ]
    example_application: "Advertorial: 'Meet Sarah, una madre soltera que tenía $40K en deuda → Su viaje a través de presupuestos fallidos y la vergüenza → Cómo una aplicación cambió su vida financiera para siempre'" 

  - name: "Hook-Story-Offer" 
    creator: "Russell Brunson" 
    source: "Secretos de DotCom (2015), Secretos de Expertos (2017)" 
    steps:
      - step: "Hook"
        detail: "Pon atención con un gancho audaz — interrumpir el patrón, brecha de curiosidad, reclamo audaz, o pregunta que exige una respuesta" 
      - step: "Story"
        detail: "Cuenta una historia del Puente Epifanía: el viaje que llevó al descubrimiento, haciendo que el público experimente la misma epifanía" 
      - step: "Offer"
        detail: "Presentar la oferta irresistible — el vehículo, la pila, los bonos, la garantía, todo diseñado para hacer decir que no se siente irracional" 
    when_to_use: "embudos, webinars y cualquier medio donde necesite crear una conexión emocional antes de lanzar" 
    best_for: [webinars, funnels, "redes sociales" , "secuencias de correo electrónico" , "presentaciones de la etapa" ]
    example_application: "Webinar: '¿Qué pasa si todo lo que sabes sobre la pérdida de peso es incorrecto? → Mi historia de descubrir la verdad → Aquí está el programa que encarna este descubrimiento'" 

  - name: "Puente de Epifanía" 
    creator: "Russell Brunson" 
    source: "Secretos de expertos (2017)" 
    steps:
      - step: "Backstory"
        detail: "Establecer el mundo del personaje antes del descubrimiento — sus creencias, luchas y la pared que golpean" 
      - step: "Viaje externo" 
        detail: "Describe los eventos externos: lo que sucedió, donde fueron, lo que intentaron, la secuencia de acciones" 
      - step: "Viaje interno" 
        detail: "Describe la transformación emocional y de creencias — el momento en que la vieja creencia se rompió y la nueva creencia formada" 
      - step: "Achievement"
        detail: "Mostrar el resultado — lo que se hizo posible una vez que la nueva creencia se apoderó." 
      - step: "Puente a Oferta" 
        detail: "Conectar la epifanía al producto — tu oferta es el vehículo que da a otros la misma epifanía sin la misma lucha" 
    when_to_use: "Al vender productos de información, coaching, o cualquier cosa donde el cambio de creencia impulsa la decisión de compra" 
    best_for: [webinars, VSLs, "embudos de libros" , "páginas de ventas de cursos" , "ofertas de coaching" ]
    example_application: "Página de ventas del curso: 'Yo creía que el éxito requería 80 horas semanas → Quemé y perdí todo → Luego descubrí el apalancamiento → Construí un negocio de $10M en 20hrs/week → Este curso le da el mismo marco" 

  - name: "Ecuación del valor" 
    creator: "Alex Hormozi" 
    source: "Ofertas de 100 M (2021)" 
    steps:
      - step: "Resultado" 
        detail: "Maximice el resultado de sueño percibido — el resultado final ideal que el cliente desea. Hacerlo tan vívido y deseable como sea posible" 
      - step: "Percibido de la probabilidad de logro" 
        detail: "Aumentar la probabilidad percibida: garantías, estudios de casos, demostraciones, pruebas sociales, credenciales, especificidad" 
      - step: "Time Delay" 
        detail: "Minimizar el tiempo percibido para dar resultado: velocidad de entrega, victorias rápidas, acceso inmediato, fast-start bonos" 
      - step: "Effort &amp; Sacrifice" 
        detail: "Minimizar el esfuerzo percibido necesario — done-for-you elementos, plantillas, atajos, soporte, step-by-step sistemas" 
    when_to_use: "Diseño de ofertas y posicionamiento: uso para ofertas de ingeniería que se sienten desproporcionadamente valioso" 
    best_for: ["oferta creación" , "estrategia de fijación de precios" , "páginas de ventas" , "cubiertas de lanzamiento" , "propuesta por escrito" ]
    example_application: "SaaS oferta: 'Obtenga 100 calificados leads/month (sueño) — garantizado o su dinero de vuelta (semejanza) — ver resultados en 14 días (velocidad) — nosotros lo arreglamos todo para usted (efuerzo)'" 

  - name: "CLOSER"
    creator: "Alex Hormozi" 
    source: "Ofertas de 100 M (2021), entrenamiento de lanzamiento de gimnasio" 
    steps:
      - step: "Clarify"
        detail: "Clarify por qué están aquí — \"¿Qué te hizo llegar hoy?\"" 
      - step: "Label"
        detail: "Etiquete el problema — reflexione con más precisión de lo que lo han declarado. Muéstrale que entiende a un nivel más profundo" 
      - step: "Overview"
        detail: "Resúmenes de experiencias pasadas — '¿Qué has probado antes? ¿Por qué no funcionó?' Mapa de su patrón de fracaso" 
      - step: "Vender las vacaciones" 
        detail: "Vender el resultado final, no el viaje en avión — pintar el destino, no el proceso." 
      - step: "Explicar preocupaciones por el camino" 
        detail: "Objeciones de mano antes de que se levanten — 'Las tres preocupaciones más grandes que la gente tiene son...' Entonces diríjase cada uno" 
      - step: "Reforzar la decisión" 
        detail: "¡Vamos! micro-commitments y reforzar — \"¿Esto tiene sentido? ¿Puedes ver cómo funciona esto para ti?" 
    when_to_use: "Venta de teléfonos, llamadas de ventas, venta de DM, cualquier 1-on-1 o la situación de venta en vivo" 
    best_for: ["scripts de ventas" , "ventas de teléfonos" , "Secuencias de DM" , "consulta" , "secuencias cercanas" ]
    example_application: "Llamada de venta: '¿Qué te trae aquí hoy? → Así que estás diciendo X te está costando Y → ¿Qué has probado? → Imagina si en 90 días... → La mayoría de la gente se preocupa por Z, aquí es por qué...'" 

  - name: "Deslizamiento deslizante" 
    creator: "Joe Sugarman" 
    source: "El manual de redacción de Adweek (2006)" 
    steps:
      - step: "Primera condena" 
        detail: "Haga la primera frase tan corta e intrigante que compele leer la segunda frase." 
      - step: "Mantener el momentum" 
        detail: "El propósito de cada frase es conseguir la siguiente oración leer. Usar bucles de curiosidad, patrones abiertos, pensamientos incompletos" 
      - step: "Crear entorno de compra" 
        detail: "Construir desencadenantes psicológicos en todo — dispositivos de participación, lenguaje de propiedad, futuros pactos, películas mentales" 
      - step: "Objeciones tempranas de semillas" 
        detail: "Planta y resuelve las objeciones antes de que el lector las levante conscientemente. Hace que el cercano se sienta natural" 
      - step: "Conclusión envidiable" 
        detail: "Para cuando llegan al CTA, comprar se siente como el único paso lógico siguiente: la diapositiva era incolora" 
    when_to_use: "Cualquier long-form copia donde mantener la atención a través de toda la pieza es crítico" 
    best_for: ["Cartas de venta" , advertorials, "correos electrónicos largos" , "scripts VSL" , "revistas public" ]
    example_application: "Advertorial: Primera línea es 7 palabras que crean una brecha de curiosidad → Cada párrafo termina con un bucle abierto → Objeciones abordadas en la narrativa → Comprar se siente inevitable" 

  - name: "Persuasión de una condena" 
    creator: "Blair Warren" 
    source: "El Curso de Persuasión de una Sentencia (Experiencia) (2013)" 
    steps:
      - step: "Alentar sus sueños" 
        detail: "Validar y amplificar sus aspiraciones — no desestimen lo que quieren, mostrarles que creen en su visión" 
      - step: "Justificar sus fracasos" 
        detail: "Quitar la culpa por los fracasos pasados — no es su culpa, el viejo methods/information/system les falló" 
      - step: "Todos sus miedos" 
        detail: "Dirija y disuelva los miedos específicos —nombre el miedo, luego proporcione evidencia o lógica que lo neutralice" 
      - step: "Confirmen sus Suspiros" 
        detail: "Validar lo que siempre sospecharon — 'Tenías razón todo el tiempo que...' Crea confianza instantánea" 
      - step: "Tiren rocas a sus enemigos" 
        detail: "Identificar al enemigo común y atacarlo — la industria, la vieja manera, el gurus, el sistema que les falló" 
    when_to_use: "Cuando usted necesita construir profundo rapport y confiar rápidamente — especialmente con audiencias escépticas o quemadas" 
    best_for: ["secuencias de correo electrónico" , "imanes de plomo" , "de la comunidad" , "contenido social" , "Aperturas VSL" ]
    example_application: "Correo electrónico: 'Siempre has sabido que algo estaba fuera de la comercialización tradicional (suspicions) → No es tu culpa que los gurus te vendieran tácticas que no funcionan (failures) → Esto es lo que la industria no quiere que sepas (enemigos)'" 

  - name: "7 Principios de influencia" 
    creator: "Robert Cialdini" 
    source: "Influencia: La Psicología de la Persuasión (1984), Pre-Suasión (2016)" 
    steps:
      - step: "Reciprocity"
        detail: "Dar valor primero — contenido libre, herramientas gratuitas, ideas libres. El deseo de reciprocar es duro" 
      - step: "Compromiso &quot; Consistencia &quot;" 
        detail: "Obtenga pequeños síes antes de pedir el gran sí - micro-commitments, cuestionarios, opt-ins, encuestas" 
      - step: "Prueba social" 
        detail: "Mostrar que otros como ellos han tomado acción — testimonios, números, estudios de casos, logos, comentarios" 
      - step: "Authority"
        detail: "Establecer credibilidad — credenciales, menciones de los medios de comunicación, resultados, experiencia, asociación con entidades conocidas" 
      - step: "Liking"
        detail: "Ser relatable y agradable — semejanza, cumplidos, valores compartidos, humor, vulnerabilidad" 
      - step: "Scarcity"
        detail: "Crear una verdadera urgencia — tiempo limitado, puntos limitados, disponibilidad limitada, bonificaciones desapareciendo" 
      - step: "Unity"
        detail: "Crear identidad compartida — \"Somos el tipo de personas que...\" Perteneciendo en grupo y conexión tribal" 
    when_to_use: "Capa en cualquier copia como amplificadores de persuasión - no una estructura independiente sino principios para tejer en todo" 
    best_for: ["todos los tipos de copia" , "especialmente las páginas de ventas" , emails, "landing pages" , ads]
    example_application: "Página de ventas: Entrenamiento gratuito de vídeo (reciprocidad) → Quiz para calificar (commitment) → '50.000+ clientes' (prueba social) → Destacado en Forbes (autoridad) → 'Sólo 100 puntos' (escasa)" 

  - name: "STRONG Method" 
    creator: "Oren Klaff" 
    source: "Lo que sea (2011)" 
    steps:
      - step: "Establecer el marco" 
        detail: "Establezca su marco como el dominante — usted es el premio, no el suplicante. Controle el contexto narrativo" 
      - step: "Cuéntaselo a la historia" 
        detail: "Usar una narrativa convincente que crea tensión e intriga — incluir un \"hombre en la selva\" momento de peligro" 
      - step: "Revelar la Intriga" 
        detail: "Presentar novedad y singularidad — lo que hace que esto sea diferente de todo lo que han visto" 
      - step: "Ofreciendo el Premio" 
        detail: "Posición de su oferta como escaso y deseable - voltear la dinámica por lo que están calificando para trabajar con usted" 
      - step: "Nail el Hookpoint" 
        detail: "Crear el momento en el que se apoyan — el pico emocional donde se comprometen mentalmente" 
      - step: "Obtener la decisión" 
        detail: "Empujar para una decisión en el momento - limitaciones de tiempo, próximos pasos, claro compromiso" 
    when_to_use: "Parcelas de alto rendimiento donde usted necesita controlar el marco — parcelas de inversores, high-ticket ventas, asociaciones" 
    best_for: ["cubiertas de lanzamiento" , "presentaciones de inversores" , "high-ticket llamadas de ventas" , "propuestas de asociación" ]
    example_application: "Parcela de inversores: Marco como oportunidad exclusiva → Historia de origen con near-death momento de negocio → Tecnología de la novela revelar → 'Estamos seleccionando 3 inversores' → Deadline para la decisión" 

  - name: "Salto Opera Secuencia" 
    creator: "Andre Chaperon" 
    source: "Autorapatrocinador Madness (2009)" 
    steps:
      - step: "Correo electrónico 1: Establecer la etapa" 
        detail: "Preséntate con vulnerabilidad e intriga: abre un gran bucle de curiosidad que abarca toda la secuencia" 
      - step: "Correo electrónico 2: High Drama / Backstory" 
        detail: "Diga el dramático backstory — la lucha, el fracaso, el momento en que todo se desmoronó." 
      - step: "Correo electrónico 3: Epifanía" 
        detail: "Revela el momento de avance — la realización que cambió todo. Conectar emocionalmente antes de revelar la solución" 
      - step: "Email 4: Beneficios ocultos" 
        detail: "Mostrar beneficios y resultados inesperados – cosas que no habrían predicho. Valor de riesgo más allá de lo obvio" 
      - step: "Email 5: Urgency / CTA" 
        detail: "Crear una verdadera urgencia para la acción — plazo, desapareciendo bonificaciones, aumento de precios, acceso limitado. Cerrar el bucle" 
    when_to_use: "Correo electrónico bienvenido secuencias y secuencias de lanzamiento donde usted necesita para construir un compromiso profundo sobre múltiples puntos de contacto" 
    best_for: ["secuencias de bienvenida" , "correos electrónicos de lanzamiento" , "curso de inscripción" , "Miembros" ]
    example_application: "Bienvenida secuencia: 'Necesito decirte algo que nunca he compartido públicamente...' → 'El día que perdí todo' → 'Luego una mañana a las 3 am...' → 'Pero aquí es lo que no esperaba' → 'Los puertas cierran el viernes a la medianoche'" 

  - name: "Mensaje de Minería" 
    creator: "Joanna Wiebe" 
    source: "Metodología de los Copyhackers / Escuela de Copias" 
    steps:
      - step: "Reunir la voz del cliente" 
        detail: "Recoger el idioma crudo de los clientes — comentarios, testimonios, tickets de apoyo, publicaciones de foro, respuestas de encuestas, transcripciones de llamadas" 
      - step: "Frases emocionales de alta intensidad" 
        detail: "Identificar frases con carga emocional — las palabras que usan al describir su dolor, deseo y transformación" 
      - step: "Categorizar por tema" 
        detail: "Frases de grupo en temas: puntos de dolor recurrentes, deseos, objeciones, motivaciones, patrones de lenguaje" 
      - step: "Mapa a las secciones de página" 
        detail: "Asignar las mejores frases a lugares específicos de copia — titulares, subtítulos, puntos de bala, CTAs, testimonios" 
      - step: "Escribe usando sus palabras" 
        detail: "Escribe copia usando su lenguaje exacto como la base, no tu frase inteligente, sino su expresión cruda" 
    when_to_use: "Antes de escribir cualquier copia, especialmente cuando se necesita para igualar el nivel de conciencia y vocabulario del público" 
    best_for: ["landing pages" , "páginas de ventas" , "copia de correo electrónico" , "ad copy" , "SaaS copy" , "páginas de productos" ]
    example_application: "Página de aterrizaje de SaaS: Mine G2 comentarios para frases de dolor → 'Me estaba ahogando en hojas de cálculo' se convierte en el titular → Características uso reviewer language verbatim" 

  - name: "E5 Method" 
    creator: "Todd Brown" 
    source: "E5 Método de formación / Marketing Funnel Automation" 
    steps:
      - step: "Engage"
        detail: "Ganar con una gran idea que es nueva, diferente y contraintuitiva, violar sus creencias existentes inmediatamente" 
      - step: "Educate"
        detail: "Enséñales el mecanismo único, por qué el viejo enfoque falla y por qué este nuevo enfoque funciona de manera diferente" 
      - step: "Excite"
        detail: "Construir la emoción a través de pruebas y posibilidades — estudios de casos, demostraciones, especificidad que lo hace real" 
      - step: "Exchange"
        detail: "Presentar la oferta como un intercambio justo — valor masivo para una inversión relativamente pequeña, respaldada por garantías" 
      - step: "Execute"
        detail: "Conducir la acción inmediata — paso siguiente específico, conductor de urgencia, eliminación de la fricción restante" 
    when_to_use: "Campañas de marketing y embudos construidos alrededor de una gran idea — especialmente los productos y coaching" 
    best_for: [VSLs, webinars, "páginas de ventas" , "secuencias de lanzamiento" , advertorials]
    example_application: "VSL: 'Los científicos acaban de descubrir un nuevo compuesto...' (ingenaje) → 'Aquí es por qué las dietas fallan en el nivel celular' (educate) → Estudios de caso (excitar) → Detalles del programa (excambio) → 'Inscribirse ahora' (ejecutar)" 

  - name: "Carta de ventas de 16 votos" 
    creator: "Evaldo Albuquerque" 
    source: "La carta de ventas de 16 votos (2019)" 
    steps:
      - step: "Identificar la creencia" 
        detail: "Encuentra la falsa creencia de UNO que, si cambia, hace la venta inevitable. No el problema — la creencia sobre el problema" 
      - step: "Escriba el Marco de 16 votos" 
        detail: "Estructura: '[Desired outcome] no se trata de [falsa creencia]. Se trata de [new] belief/mechanism].' Esta es la columna vertebral de toda la carta de ventas" 
      - step: "Construir el plomo" 
        detail: "Abierto con el tipo de plomo que coincide con la conciencia de la audiencia — directo, indirecto, historia, proclamación, secreto o predicción" 
      - step: "Destrozar la Falsa Creencia" 
        detail: "Desmantelamiento sistemático de la vieja creencia usando lógica, historias, analogías y pruebas. Hacer que el viejo camino parezca obviamente equivocado" 
      - step: "Instala la Nueva Creencia" 
        detail: "Reemplazar con la nueva creencia ligada a su mecanismo único — lo que hace que su solución sea la elección inevitable" 
    when_to_use: "Cartas de ventas de larga duración y VSL, especialmente en mercados competitivos donde la diferenciación por creencia es clave" 
    best_for: ["Cartas de venta" , VSLs, advertorials, health/finance/biz-opp markets]
    example_application: "Salud VSL: 'Perder peso no es sobre comer menos y hacer ejercicio más (falsa creencia). Se trata de restablecer su termostato metabólico (nuevo) belief/mechanism).'" 

  - name: "CopyTHINKING"
    creator: "Ry Schwartz" 
    source: "CopiasHackers / Copiar el entrenamiento de correo electrónico" 
    steps:
      - step: "Niveles de conciencia de mapa" 
        detail: "Parcela donde su suscriptor está en el espectro de conciencia de Schwartz —sin darse cuenta, problem-aware, solution-aware, product-aware, most-aware" 
      - step: "Temperatura Emocional Partido" 
        detail: "Coincide con el estado emocional del lector en cada nivel de conciencia — frustración, esperanza, escepticismo, urgencia" 
      - step: "Elija el cambio de conciencia" 
        detail: "Cada email mueve el nivel de lector UNA hacia adelante en el espectro de conciencia — nunca trate de saltar múltiples niveles" 
      - step: "Apply Sequence Architecture" 
        detail: "Estructurar la secuencia para que cada email fluya lógicamente hacia el siguiente, construyendo el caso incrementalmente" 
      - step: "Cerrar en Información de Producto" 
        detail: "Sólo lanzar cuando han alcanzado product-aware — la secuencia gana el derecho de vender mediante la creación progresiva de conciencia" 
    when_to_use: "Secuencias de correo electrónico donde usted necesita mover suscriptores a través de niveles de conciencia antes de vender" 
    best_for: ["secuencias de correo electrónico" , "campañas de fomento" , "secuencias de lanzamiento" , "SaaS correos electrónicos a bordo" ]
    example_application: "secuencia de correo electrónico de SaaS: E1 (problem-aware → dolor agitado) → E2 (solution-aware → categoría de espectáculos) → E3 (product-aware → introducir su herramienta) → E4 (most-aware → deal/deadline)" 

  - name: "Método de la bala de Fascinación" 
    creator: "Clayton Makepeace / Gary Bencivenga" 
    source: "Paquete Total de Makepeace, Seminario de Persuasión de Bencivenga" 
    steps:
      - step: "Identificar el Payoff" 
        detail: "Comience con el beneficio específico o secreto — lo que el lector aprenderá, ganará o descubrirá" 
      - step: "Agregar la especificación" 
        detail: "Incluye números, nombres, detalles — 'El ritual de la mañana de 3 minutos' supera 'Una rutina de la mañana'" 
      - step: "Crear Curiosidad Gap" 
        detail: "Hint en la información sin revelarla — crear una picazón que sólo puede ser raspado por la compra" 
      - step: "Use plantillas de energía" 
        detail: "Plantillas: 'Cómo [beneficio] sin [pain], 'El [número] [cosa] que [resulta]', 'Por qué [lo común] es [la verdad sorprendente], 'Lo que [expertos] saben acerca de [topic] que no '" 
      - step: "Estante para el Momentum" 
        detail: "Grupo 5-7 balas en un bloque, mezclando benefit-driven y curiosity-driven. Cada bala debe ser lo suficientemente fuerte para vender por sí sola" 
    when_to_use: "Secciones de bala en cartas de venta, teteras de correo electrónico, opt-in lista de beneficios de página, VSL mid-sections" 
    best_for: ["Cartas de venta" , VSLs, opt-in pages, "email teasers" , "Listados de Amazon" , "descripciones de los planes de estudios" ]
    example_application: "Bolas de carta de venta: '• El ingrediente de cocina de 11 centavos que disuelve grasa de vientre obstinado (página 23) • Por qué su médico nunca le dirá sobre esta alternativa aprobada por la FDA • 3 alimentos comercializados como saludables que están destruyendo silenciosamente su tiroides'" 

  - name: "Marco de la PNUFID" 
    creator: "Rosser Reeves" 
    source: "Realidad en Publicidad (1961)" 
    steps:
      - step: "Identificar una reclamación única" 
        detail: "Encuentra la proposición UNA que tu competidor no puede o no ofrece, debe ser única para ti" 
      - step: "Verificar el valor del cliente" 
        detail: "La reclamación debe ser algo que el cliente realmente quiere, no sólo único, sino únicomente valioso" 
      - step: "Hazlo específico" 
        detail: "Cuantifique y especifique — 'Melts in your mouth, not in your hands' es específico. 'Gran calidad' no es" 
      - step: "Memorabilidad de ensayo" 
        detail: "La USP debe ser lo suficientemente simple para recordar y repetir — si no puede encajar en una frase, es demasiado complejo" 
      - step: "Construir todo Copiar alrededor de él" 
        detail: "Cada anuncio, cada página, cada correo electrónico refuerza la USP — la consistencia crea penetración" 
    when_to_use: "Posición de marca, lanzamientos de nuevos productos, entrada de mercados competitivos, diferenciando ofertas mercantilizadas" 
    best_for: ["copia de marca" , taglines, "ascensor" , "campañas publicitarias" , "landing page headlines" ]
    example_application: "Posicionamiento de SaaS: Competidores de auditoría → Buscar que ninguna oferta real-time colaboración → USP: 'La única herramienta de proyecto donde todo su equipo edita simultáneamente — cero lag, cero conflictos' → Construir todo copia alrededor de este" 

  - name: "Marco de Empatía Táctica" 
    creator: "Chris Voss" 
    source: "Nunca divida la diferencia (2016)" 
    steps:
      - step: "Mirror"
        detail: "Repita las últimas palabras críticas de 1-3 de lo que el prospecto dijo: activa la elaboración y muestra que está escuchando" 
      - step: "Etiqueta el movimiento" 
        detail: "Nombra lo que sienten: \"Parece que estás frustrado con...\" o \"Suena como si te sintieras...\"" 
      - step: "Auditoría de la acusación" 
        detail: "Listar proactivamente todas las cosas negativas que podrían pensar en ti: 'Probablemente estás pensando que esto es demasiado caro, demasiado bueno para ser verdad, sólo otro guru...' Las desarmas" 
      - step: "Preguntas calibradas" 
        detail: "Pregunta '¿Cómo' y 'Qué' preguntas que los hacen resolver su problema - '¿Cómo le gustaría manejar esto? ¿Qué haría que esto funcionara para usted?'" 
      - step: "Eso es correcto." 
        detail: "Empujar para una respuesta 'eso' correcta resumiendo su situación con tanta precisión que lo confirman - esto es más profundo que 'sí'" 
    when_to_use: "Llamadas de venta, venta de DM, manipulación de objeciones en copia, prevención de reembolsos, negociaciones de asociación" 
    best_for: ["scripts de ventas" , "copia de la objeción" , "Secciones de preguntas frecuentes" , "scripts chatbot" , "éxito del cliente" ]
    example_application: "Palabras de llamada de ventas: '¿Así que has probado tres agencias y ninguna entrega? (mirror) → Suena como si te sientes quemada (label) → Probablemente estás pensando por qué sería diferente (audita) → ¿Cómo sería el éxito para ti? (calibrado)'" 

  - name: "Control de marcos" 
    creator: "Oren Klaff" 
    source: "Pitch Cualquier cosa (2011), Flip el script (2019)" 
    steps:
      - step: "Identificar el marco de Dominant" 
        detail: "¿Reconoce el marco existente, quién controla actualmente la narración? ¿Es el marco del comprador, el marco del mercado, o el suyo?" 
      - step: "Establezca su marco" 
        detail: "Establezca su marco antes del compromiso — usted es el premio, el experto, la autoridad. No el súplica" 
      - step: "Use coagisones de marco" 
        detail: "Cuando los marcos chocan, el más fuerte absorbe el más débil. Usa el humor, el estado o la autoridad moral para ganar colisiones de marco" 
      - step: "Aplicar presión de tiempo" 
        detail: "Controla el reloj — 'Tengo 15 minutos' establece tu tiempo como valioso y crea urgencia" 
      - step: "Frame del Premio" 
        detail: "Póngase como el premio — 'Estamos selectivos sobre con quién trabajamos' voltea el buyer-seller dinámica" 
    when_to_use: "Ventas de alta velocidad, negociaciones, situaciones de lanzamiento, cualquier contexto en el que la dinámica de estado afecta el resultado" 
    best_for: ["cubiertas de lanzamiento" , "high-ticket páginas de ventas" , "propuestas de organismos" , "prima marca copy" ]
    example_application: "Agencia pitch: 'Sólo tomamos 3 nuevos clientes por trimestre → Por eso nuestro último cliente nos dijo que no primero → Bajamos $2M en proyectos el año pasado → Si esto es un ajuste, aquí es lo que sucede después'" 

  - name: "Ecuación de la persuasión" 
    creator: "Múltiples contribuyentes (marco sintetizado)" 
    source: "Derivado de Cialdini, Sugarman, Schwartz, y economía conductual" 
    steps:
      - step: "Urgencia + escasez" 
        detail: "¿Por qué ahora? Tiempo limitado, puntos limitados, precios crecientes, puertas de cierre — crear presión temporal" 
      - step: "Autoridad + Prueba Social" 
        detail: "¿Por qué confiar? Credenciales, medios, testimonios, estudios de casos, números: establecer credibilidad" 
      - step: "Deseo + futuro pacto" 
        detail: "¿Por qué quieres? Pintar el resultado vívidamente, hacer que sientan el after-state, involucrar emociones" 
      - step: "Logic + Justificación" 
        detail: "¿Por qué racional? Comparación de costos, cálculo ROI, argumento lógico — da el permiso del cerebro para comprar lo que el corazón ya quiere" 
      - step: "Reversal de Riesgo" 
        detail: "¿Por qué seguro? Garantía, ensayo, política de reembolso, prueba social de seguridad — eliminar la última barrera" 
    when_to_use: "Cerrar secciones de cualquier copia de ventas — escoge estos elementos para crear presión irresistible de compra" 
    best_for: ["página de ventas cierra" , "páginas de registro" , "email cierra" , "webinar cierra" , "abandono del carrito" ]
    example_application: "Página de ventas cercana: 'Sólo 47 puntos permanecen (escasa) → Destacados en Inc, Forbes, Entrepreneur (autoridad) → Imagínate 6 meses a partir de ahora... (desire) → A $997 esto es menos de $3.30/day (logic) → Garantía completa de 365 días (reversión de riesgo)'" 
