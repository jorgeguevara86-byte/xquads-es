workflow:
  id: wf-copy-review-cycle
  name: "Ciclo de Revisao de Copy Master" 
  version: "2.0.0"
  description: "Ciclo iterativo de escrita-critica-revisao con una capa de psicología de persuasión.\nUn experto produce copia, el Jefe de la Copia hace la revisión incluyendo la auditoría\nde psicología (Cialdini/Warren), y los exámenes de expertos basados en la retroalimentación.\nMáximo de 3 iteraciones antes de subir o aprobación forzada."
  trigger: "*copy-review-cycle"
  entry_agent: copy-master-chief
  estimated_duration: "20-45 minutes"
  type: iterative
  sequence:
    - agent: "{specialist}"
      action: write-draft
      creates: draft_copy
    - agent: copy-master-chief
      action: psychology-checkpoint
      creates: psychology_audit
    - agent: copy-master-chief
      action: critique
      creates: critique_report
    - agent: "{specialist}"
      action: revise
      creates: revised_copy
    - agent: copy-master-chief
      action: final-review
      creates: final_verdict

config:
  max_iterations: 3
  pass_threshold: 60
  elite_threshold: 80
  min_cialdini_principles: 3
  min_warren_levers: 2

phases:
  - id: phase_0
    name: "Producción inicial" 
    agent: "{specialist}"
    task: "{matched_task}"
    description: "El especialista escribe el proyecto inicial utilizando la tarea apropiada (write-headline.md, write-sales-letter.md, write-webinar-script.md, etc.). La tarea se selecciona en función del tipo de copia solicitado. El borrador debe incluir la Capa Psicológica." 
    outputs:
      - draft_copy: "markdown"
      - iteration: "number"
    checkpoint:
      gate: "Borrador completo con todas las secciones necesarias, incluyendo la Capa Psicológica" 
      veto: "Borrador de elementos críticos incompletos o desaparecidos o cartografía de persuasión" 

  - id: phase_1
    name: "Punto de control de Psicología" 
    agent: copy-master-chief
    task: review.md
    depends_on: [phase_0]
    description: "Copia Jefe Maestro verifica la capa de psicología de persuasión. Cheques Cialdini principios (min 3), Warren palancas (min 2), e integración natural. Banderas lagunas como elementos WARN para la fase crítica." 
    outputs:
      - psychology_audit: "markdown"
      - psychology_gaps: "list"
    checkpoint:
      gate: "umbrales mínimos de psicología cumplidos" 
      veto: "Cero Cialdini principios presentes - proyecto fundamentalmente incompleto" 

  - id: phase_2
    name: "Chief Critique" 
    agent: copy-master-chief
    task: critique-copy.md
    depends_on: [phase_1]
    description: "Copia Jefe Maestro realiza una auditoría de psicología de 8 puntos mejorada y persuasión. Asigna puntajes, identifica el defecto fatal, proporciona una lista de fijación priorizada con ejemplos de reescritura, e incluye recomendaciones de brecha de psicología." 
    outputs:
      - critique_report: "markdown"
      - composite_score: "number"
      - verdict: "string"
      - fix_list: "list"
      - psychology_fixes: "list"
    checkpoint:
      gate: "Resultado √≥= 60% Y control de psicología aprobado para entrega" 
      veto: "Puntuación: 40% después de la iteración 3 - escalada" 

  - id: phase_3
    name: "Specialist Revision" 
    agent: "{specialist}"
    task: "{matched_task}"
    depends_on: [phase_2]
    condition: "Veredicto!= 'Elite' Y veredicto!= 'Strong' Y iteración max_iterations" 
    description: "El especialista revisa la copia que aborda todos los elementos de la lista de fijación priorizada incluyendo brechas de psicología. Enfóquese en el defecto mortal primero, luego arregla la psicología, luego gana rápidamente, luego resta elementos." 
    outputs:
      - revised_copy: "markdown"
      - changes_made: "list"
    checkpoint:
      gate: "Todas las prioridades 1 fijaciones abordadas y las lagunas de psicología resueltas" 
      veto: "Fallo fatal no tratado en revisión" 

  - id: phase_4
    name: "Examen final" 
    agent: copy-master-chief
    task: critique-copy.md
    depends_on: [phase_3]
    description: "Copia Jefe Maestro realiza crítica final incluyendo psicología re-auditSi la puntuación mejoró y pasa umbral con control de psicología, apruebe. Si no mejoró después de las iteraciones máximas, se escala con problemas documentados." 
    outputs:
      - final_critique: "markdown"
      - final_verdict: "string"
    checkpoint:
      gate: "Puntuación √≥= 60% Y control de psicología aprobado O max iterations alcanzadas con excepciones documentadas" 
      veto: "El porcentaje disminuyó entre las iteraciones — investigar la causa raíz" 

iteration_rules:
  on_pass: "Entregar copia final con informe crítico y documentación de arquitectura de persuasión" 
  on_fail_under_max: "Regresa a phase_3 con lista de fijación actualizada incluyendo brechas de psicología" 
  on_max_reached: "Aprobar con preocupaciones documentadas O escalar al usuario" 
  score_regression: "Si la puntuación cae entre iteraciones, deténgase y vuelva a evaluar el enfoque" 
  psychology_fail: "Si el control de psicología falla después de la revisión, bandera para la intervención directa del Jefe de Copia" 

completion_criteria:
  - "Copia consigue un veredicto fuerte o elite" 
  - "Traspaso de control de Psicología (min 3 Cialdini, min 2 Warren)" 
  - "O máximas iteraciones alcanzadas con todas las prioridades 1 correcciones abordadas" 
  - "Informe crítico presentado con cada iteración documentada" 
  - "Copia final marcada como aprobada o escalada con arquitectura de persuasión" 
