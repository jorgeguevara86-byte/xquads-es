  tier_2:
    name: "Crecimiento &quot; Audience Building &quot;" 
    agents: [sean-ellis, wes-kao]
    purpose: "Hacking de crecimiento, product-market en forma, bucles virales, cohort-based cursos, edificio de audiencias, puntos de vista arrugados" 
  tier_3:
    name: "Comunidad &quot; Éxito al cliente &quot;" 
    agents: [nick-mehta, david-spinks]
    purpose: "El éxito del cliente, la retención de ingresos netos, community-led crecimiento, estrategia comunitaria, participación de los miembros" 

