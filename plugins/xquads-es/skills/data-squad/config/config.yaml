  display_name: "Fecha de la reunión" 
  version: "1.0.0"
  domain: "Crecimiento generado por datos &quot; Inteligencia del cliente" 
  description: "Un equipo de la líder mundial data-driven estrategas que combinan mastery anal\n(Avinash Kaushik), valor de la vida del cliente (Peter Fader), piratería de crecimiento (Sean Ellis),\ncommunity-led crecimiento (David Spinks), éxito del cliente (Nick Mehta), y audiencia\nedificio (Wes Kao).\n\nCada asesor trae battle-tested marcos que convierten los datos en decisiones y métricas\nen crecimiento. Juntos cubren todo el espectro de la adquisición a la retención."
