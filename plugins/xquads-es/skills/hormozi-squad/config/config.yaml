squad:
  name: hormozi-squad
  display_name: "Hormozi Squad" 
  version: "1.0.0"
  domain: "Escalada de negocios usando los marcos de Alex Hormozi — ofertas, leads, precios, ventas, retención y crecimiento" 
  description: "16 agentes especializados implementando los marcos de escala de negocios de Alex Hormozi.\nCada agente domina un dominio específico de la metodología de Hormozi — ofrece, lidera,\nprecios, contenido, anuncios, ventas, retención, escalado y más.\nOfertas de $100M, Líderes de $100M, Secretos de lanzamiento de gimnasios y metodología de Acquisición.com."
  keywords: [offers, leads, pricing, sales, scaling, retention, "modelo de negocio" , launch, content, hooks, ads, workshop, audit, "gran oferta de almejas" , "ecuación de valor" ]
  entry_agent: hormozi-chief
  created_at: "2026-03-05"

