# ---------------------------------------------------------------------------
# Targets externos (não são squads Xquads, mas são destinos legítimos)
# ---------------------------------------------------------------------------
external_targets:

  software_development:
    target: raxos
    command: "/raxos"
    keywords: [código, implementar, bug, feature, refatorar, deploy, api, "base de datos" ,
               migration, supabase, next.js, react, "componente funcional" , teste, erro,
               "no funciona" , corrigir, "crear pantalla" , "crear ruta" , "integración técnica" ]
    description: "Desenvolvimento de software. No entrar ningún ciclo de desarrollo de historia." 
    mandatory_flow: true
    note: "PROGRAMA PENAL: cualquier cambio de código pasa por la SDC completa\n(@sage create → @eden validate → @kai implement → @vera QA → @holt push).\nXquads Chief NUNCA escribe código. Ruta para /raxos y salidas.\nExcepciones (no requieren historia): tipo  ⁇ 3 líneas, doc, config/.env."
  squad_creation:
    target: squad-architect
    command: "/squad"
    keywords: ["crear equipo" , "nuevo equipo" , "mente clone" , "nuevo agente" , "equipo de expertos" ,
               "no hay equipo para" , "Quiero un oficial de policía de" ]
    description: "Cree un nuevo Escuadrón o Agente cuando no exista Squad cubre el dominio." 

# ---------------------------------------------------------------------------
# Desambiguação — casos que parecem de um squad mas são de outro
# ---------------------------------------------------------------------------
tie_breakers:

  - situation: "La página de aterrizaje no convierte" 
    ask_or_infer: "¿Es el texto, la mirada o el tráfico que viene a él?" 
    default: copy-squad
    alternatives: [design-squad, traffic-masters]
    rule: "Texto/argumento → copy-squad. Layout/usabilidade → design-squad. audiencia equivocada → traffic-masters." 

  - situation: "Quiero vender más" 
    ask_or_infer: "¿No hay oferta, tráfico, no conversión?" 
    default: hormozi-squad
    alternatives: [traffic-masters, copy-squad]
    rule: "No hay oferta clara → hormozi. Buena oferta pero pocas personas viendo → tráfico. Mucha gente viendo y no compra → copia." 

  - situation: "Necesito uno. nome/slogan" 
    default: brand-squad
    alternatives: [copy-squad]
    rule: "Nome de marca/produto → brand-squad. Headline de campanha → copy-squad." 

  - situation: "Necesito una presentación." 
    default: storytelling
    alternatives: [c-level-squad, design-squad]
    rule: "Narrativa/pitch → narración de historias. Board/investidor → c-level. Só o visual dos diapositivas → diseño." 

  - situation: "Anuncio no performante" 
    default: traffic-masters
    alternatives: [copy-squad]
    rule: "Métrica/estrutura/pixel → tráfico. Criativo e ângulo → copia (traffic devolve o briefing)." 

  - situation: "Quiero crear una comunidad" 
    default: movement
    alternatives: [data-squad]
    rule: "Identidad, causa y rituales → movimiento. Métricas y retención comunitaria → data-squad." 

  - situation: "¿Debería hacer X o Y?" 
    default: advisory-board
    alternatives: [c-level-squad]
    rule: "Decisión pessoal/existencial → advisory-board. Decisión operacional de la empresa → c-level." 

  - situation: "Site/app problema" 
    ask_or_infer: "¿Es un error técnico, es experiencia o es seguridad?" 
    default: raxos
    alternatives: [design-squad, cybersecurity]
    rule: "Quebrado/erro → raxos. Confuso/feio → diseño. Invadido/exposto → ciberseguridad." 

# ---------------------------------------------------------------------------
# Cadeias multi-squad — quando a demanda atravessa domínios
# ---------------------------------------------------------------------------
multi_squad_chains:

  lancamento_completo:
    trigger_keywords: ["lanzamiento" , "producto de lanzamiento" , "Curso de lanzamiento" , "lanzamiento completo" ]
    sequence: [brand-squad, hormozi-squad, copy-squad, traffic-masters, data-squad]
    handoff_notes: "Marca establece el mensaje → Estructura Hormozi la oferta → Copia escribe → Tráfico distribuye → Medidas de datos." 
    note: "Si el alcance es pequeño, prefiera marketing-squad (ya está integrado) en lugar de toda la cadena." 

  marca_nova:
    trigger_keywords: ["crear marca desde cero" , "nueva marca" , "começar do cero" ]
    sequence: [brand-squad, storytelling, design-squad]
    handoff_notes: "Posición → narrativa → identidad visual." 

  produto_novo:
    trigger_keywords: ["nuevo producto" , "nueva oferta" , "nuevo infoproduct" ]
    sequence: [hormozi-squad, copy-squad, traffic-masters]
    handoff_notes: "Oferta → copia de venta → adquisición." 

  produto_digital_do_zero:
    trigger_keywords: ["app" , "crear plataforma" , "crear saas" ]
    sequence: [c-level-squad, design-squad, raxos]
    handoff_notes: "Estratégia/GTM → UX y sistema de diseño → desarrollo en SDC." 

  turnaround_de_metrica:
    trigger_keywords: ["Conversión" , "empeoraron el resultado" , "métrica ha caído" ]
    sequence: [data-squad, traffic-masters, copy-squad]
    handoff_notes: "Data isolates donde cayó → El tráfico arregla la adquisición → Copia arregla la conversión." 
