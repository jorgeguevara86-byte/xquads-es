# Routing Catalog: Xquads Chief (Meta-Orquestrador)
# Mapeia demanda em linguagem natural -> squad -> chefe do squad
# Referenciado por: tasks/diagnose.md e tasks/route.md
#
# Keywords em PT-BR primeiro (idioma do usuário), EN como fallback.

meta:
  version: "1.0.0"
  total_squads: 14
  # ATIVAÇÃO — independente de cliente.
  #   `squad`  é também o nome da skill e o nome da pasta. Ative lendo o SKILL.md
  #            dela e seguindo as instruções de ativação que estão lá. Funciona em
  #            Claude Code, Codex, Gemini CLI, Cursor, Copilot, OpenCode e afins.
  #   `legacy_command` é o atalho antigo, válido só em instalações do Claude Code
  #            feitas em ~/.claude/commands/. Use apenas se o cliente for o Claude
  #            Code E o squad estiver instalado por esse caminho.
  # Se o squad não estiver instalado, a rota fica indisponível: avise o usuário,
  # indique `install.sh <squad>` e ofereça a alternativa mais próxima entre as
  # instaladas — nunca finja ter ativado um squad ausente.
  confidence_thresholds:
    high: 80    # roteia direto, sem perguntar
    medium: 50  # roteia declarando a premissa assumida
    low: 0      # faz UMA pergunta de desambiguação

domains:

  copywriting:
    squad: copy-squad
    chief: copy-chief
    legacy_command: "/copy-squad:agents:copy-chief"
    agents: 23
    keywords: [copy, copywriting, headline, título, chamada, "carta de ventas" , "carta de ventas" ,
               vsl, "script de vídeo" , email, "sequência de email" , bullets, "oferta escrita" ,
               "página de ventas" , "landing page" , texto, escrever, "persuasión" , "disparador mental" ,
               anúncio, "texto creativo" , "Ventas itinerarias" ]
    escalate_to: copy-master
    escalate_when: "Proyecto grande/complexo, mercado saturado, necesidad de negociación, lanzamiento o copia SaaS" 
    description: "Escribe cualquier texto cuyo propósito es vender o convertir." 

  copywriting_advanced:
    squad: copy-master
    chief: copy-master-chief
    legacy_command: "/copy-master:agents:copy-master-chief"
    legacy_command_alias: "/Copy-Master:agentes:copy-master-chief"   # instalações legadas com pasta capitalizada
    agents: 33
    keywords: ["copy master" , "Copia avanzada" , "cubierta de lanzamiento" , webinar, "negociación" , "chris yos" ,
               "oren klaff" , "saas copy" , "mercado saturado" , copy 2.0]
    description: "El Escuadrón de Copias Turbulentos — 33 maestros, incluye persuasión, campo, comercio y SaaS." 

  paid_traffic:
    squad: traffic-masters
    chief: traffic-chief
    legacy_command: "/traffic-masters:agents:traffic-chief"
    agents: 16
    keywords: [tráfego, "tráfico pagado" , anúncio, ads, "meta ads" , "facebook ads" , "anuncios de instagram" ,
               "google ads" , "youtube anuncios" , "campaña public" , cpa, cpl, roas, cac, escala,
               "campaña escalar" , "medios comprando" , pixel, rastreamento, tracking, gerenciador,
               "ad set" , verba, budget, "optimización de la campaña" , "creativo" ]
    description: "Comprar medios, escala, optimización y seguimiento de campañas pagadas." 

  branding:
    squad: brand-squad
    chief: brand-chief
    legacy_command: "/brand-squad:agents:brand-chief"
    agents: 15
    keywords: [marca, branding, posicionamento, identidade, "identidad visual" , naming,
               "nombre de marca" , arquétipo, "valor de marca" , "arquitectura" , tagline,
               slogan, storybrand, "diferenciación" , reposicionamento, rebrand, "propósito de la marca" ]
    description: "Construir, posicionar o reponer una marca." 

  integrated_campaign:
    squad: marketing-squad
    chief: marketing-chief
    legacy_command: "/marketing-squad:agents:marketing-chief"
    agents: 5
    keywords: [campanha, "campaña completa" , marketing, "plano de marketing" , mensagem,
               "propina" , "mensaje + copia + creatividad + tráfico" , "Campaña integrada" ]
    description: "Campaña final a fin (mensaje → copiar → creativo → tráfico) con tiempo magro." 
