squad:
  name: storytelling
  display_name: "equipo de historias" 
  version: "1.0.0"
  domain: "Narrative &quot; Communication" 
  description: "Escuadrón de élite de maestros narradores que abarcan mitología, escritura, narrativa personal,\ncuentos de negocios, improvisación, lanzamiento, presentaciones y movimientos sociales.\nEl viaje de Campbell a Harmon's Story Circle, desde la hoja de la Beata de Snyder hasta el Coyne\nHistoria Grid — cada marco narrativo creado, unificado bajo un mismo techo.\n\nCubre seis dominios narrativos: estructura mítica, arquitectura de cuentos, narrativa personal,\nnarración de negocios, persuasión y rendimiento, y narrativa de movimiento.\ntrae décadas de real-world arte destilado en marcos de acción."
  keywords: [storytelling, narrative, screenwriting, mythology, presentations, brand-story, pitching, improv, social-movements, story-structure]
  entry_agent: story-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orchestration"
    agents: [story-chief]
    purpose: "Triage, routing, control de calidad, dominio narrativo que coincide" 
  tier_1:
    name: "Maestros narrativos" 
    agents: [joseph-campbell, dan-harmon, blake-snyder, shawn-coyne, matthew-dicks, kindra-hall, nancy-duarte, park-howell, keith-johnstone, oren-klaff, marshall-ganz]
    purpose: "Experiencia de dominio en todos los marcos narrativos, desde la estructura mítica a los movimientos sociales" 

agents:
  story-chief:      { file: agents/story-chief.md, tier: 0, icon: "📖", focus: "Triage, routing, narrativa dominio matching"  }
  joseph-campbell:   { file: agents/joseph-campbell.md, tier: 1, icon: "🏛️", focus: "Viaje de héroe, monomítico, arquetipos"  }
  dan-harmon:        { file: agents/dan-harmon.md, tier: 1, icon: "🔄", focus: "Círculo de historia, TV/episodic escritura"  }
  blake-snyder:      { file: agents/blake-snyder.md, tier: 1, icon: "🎬", focus: "Hoja de la venda, estructura de guión"  }
