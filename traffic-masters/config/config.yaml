squad:
  name: traffic-masters
  display_name: "Maestros de Tráfico" 
  version: "1.0.0"
  domain: "Adquisición de tráfico de pago en todas las principales plataformas: compra de medios, creativo, analítico y escalado" 
  description: "16 agentes especializados que dominan la adquisición de tráfico pagado en todas las plataformas principales.\nCombinaciones real-person expertos (expertos de expertos)world-class compradores de medios y estrategas de anuncios) con\nagentes especializados funcionales para análisis creativos, optimización de rendimiento, escalado,\ny gestión fiscal. Facebook/Meta, YouTube, Google, TikTok y LinkedIn."
  keywords: ["tráfico pagado" , "Anuncios de Facebook" , "Google ads" , "Anuncios de YouTube" , "Anuncios de TikTok" , "medios comprando" , creative, scaling, ROAS, CPA, tracking, pixels, attribution, "presupuesto ad" ]
  entry_agent: traffic-chief
  created_at: "2026-03-05"

