    name: "Orchestration"
    agents: [traffic-chief]
    purpose: "Diagnosticar los retos de tráfico, ruta al especialista adecuado por plataforma o función" 
  tier_1_experts:
    name: "Agentes expertos de la plataforma" 
    agents: [molly-pittman, ralph-burns, depesh-mandalia, nicholas-kusmich, tom-breeze, kasim-aslam, pedro-sobral]
    purpose: "Expertos de tráfico de clase mundial clonados de profesionales reales con registros de pistas comprobados" 
  tier_1_functional:
    name: "Especialistas funcionales" 
    agents: [ad-midas, media-buyer, performance-analyst, creative-analyst, scale-optimizer, pixel-specialist, ads-analyst, fiscal]
    purpose: "Agentes especializados para funciones específicas de gestión del tráfico" 

